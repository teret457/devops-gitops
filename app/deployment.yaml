apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-web}
  template:
    metadata:
      labels: {app: lab-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - {name: content, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
        - name: content
          configMap: {name: lab-web}
